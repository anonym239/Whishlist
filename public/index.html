<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wunschliste 🎁</title>
<style>
:root{--bg:#fff3ec;--card:#ffffffb8;--tx:#2b2230;--mu:#7a6f80;--ac:#ff3d81;--ac2:#ffa63d;--ac3:#7c4dff;--bd:#ffffffd9;--in:#ffffffcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a18;--card:#1d1530a6;--tx:#f6f0ff;--mu:#aa9cc0;--bd:#ffffff1f;--in:#ffffff12}}
:root[data-theme="dark"]{--bg:#0e0a18;--card:#1d1530a6;--tx:#f6f0ff;--mu:#aa9cc0;--bd:#ffffff1f;--in:#ffffff12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(50px)}
body::before{background:radial-gradient(35% 35% at 20% 25%,rgba(255,61,129,.40),transparent),radial-gradient(35% 35% at 80% 30%,rgba(124,77,255,.38),transparent);animation:drift 16s ease-in-out infinite alternate}
body::after{background:radial-gradient(40% 40% at 55% 85%,rgba(255,166,61,.38),transparent),radial-gradient(30% 30% at 10% 80%,rgba(0,200,255,.25),transparent);animation:drift 22s ease-in-out infinite alternate-reverse}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:var(--in);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:20px;cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac3),var(--ac2),var(--ac));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
button,.btn{font:inherit;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;box-shadow:0 6px 18px rgba(255,61,129,.35)}
button::after,.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);transition:left .6s}
button:hover::after,.btn:hover::after{left:130%}
button:hover,.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 28px rgba(124,77,255,.45)}
button:active,.btn:active{transform:scale(.96)}
button.g{background:var(--in);color:var(--tx);border:1px solid var(--bd);box-shadow:none;backdrop-filter:blur(10px)}
.auth button{width:100%;margin-top:6px;padding:14px;font-size:17px;animation:pulse 2.4s ease-in-out infinite}
main{max-width:1000px;margin:0 auto;padding:10px 20px 60px;position:relative;z-index:1}
.c{text-align:center}.mu{color:var(--mu)}
h1{font-size:clamp(28px,6vw,48px);margin:18px 0 8px;font-weight:900;background:linear-gradient(90deg,var(--ac),var(--ac3),var(--ac2),var(--ac));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:in .8s both,shine 7s linear infinite}
.box{text-align:center;max-width:760px;background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:24px;padding:24px;margin:20px auto;box-shadow:0 20px 50px rgba(124,77,255,.15);animation:in .7s both}
.auth{max-width:400px;animation:in .7s both,float 6s ease-in-out 1s infinite}
.auth a{color:var(--ac);font-weight:600}
input{text-align:center;font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);margin:5px 0;outline:0;transition:box-shadow .25s,border-color .25s,transform .25s}
input[type=file]::file-selector-button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 16px;margin-right:12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac3))}
input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(255,61,129,.2);transform:scale(1.015)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,290px));justify-content:center;gap:22px;margin-top:24px}
.card{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;animation:card .7s cubic-bezier(.2,.9,.3,1.2) backwards;transition:transform .15s ease-out,box-shadow .3s;position:relative;will-change:transform}
.card:hover{box-shadow:0 22px 44px rgba(124,77,255,.3)}
.im{height:190px;background:linear-gradient(135deg,rgba(255,61,129,.25),rgba(124,77,255,.25)) center/cover;display:grid;place-items:center;font-size:60px}
.b{padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;flex:1}
.b strong{font-size:17px}
.b .btn{margin-top:auto;width:100%}
.n{position:absolute;top:10px;left:10px;z-index:2;font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px;background:#000b;color:#fff}
.x{position:absolute;top:10px;right:10px;padding:4px 11px;background:#000b;box-shadow:none;z-index:2}
.f{position:fixed;top:-40px;font-size:24px;opacity:.5;animation:fall linear infinite;pointer-events:none;z-index:0}
.p{position:fixed;z-index:99;pointer-events:none;font-size:22px;animation:pop 1s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes card{from{opacity:0;transform:translateY(40px) scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes drift{to{transform:translate(8%,6%) scale(1.15) rotate(8deg)}}
@keyframes shine{to{background-position:300% 0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,61,129,0),0 10px 28px rgba(255,61,129,.55)}}
@keyframes pop{to{transform:translate(var(--dx),calc(var(--dy) + 220px)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head>
<body>
<header><div class="logo" id="logo">🎁 Wunschliste</div><div id="nav"></div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))x.startsWith('on')?e.addEventListener(x.slice(2),v):x==='class'?e.className=v:e.setAttribute(x,v);e.append(...k.flat().filter(c=>c!=null&&c!==false));return e};
const mem={};
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return mem[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=v}},del:k=>{try{localStorage.removeItem(k)}catch{delete mem[k]}}};
const rc=(el,...k)=>el.replaceChildren(...k.filter(Boolean));
const ok=u=>/^https?:\/\//i.test(u||'');
const okImg=u=>ok(u)||/^data:image\//.test(u||'');

/* ---- Backend: Netlify-Function (/api). Ohne Backend (Vorschau) -> Demo-Modus im Browser ---- */
let remote=null;
const R=(a,d)=>fetch('/api',{method:'POST',body:JSON.stringify({action:a,...d})}).then(r=>r.json());
const L={db:()=>JSON.parse(ls.get('wl-db')||'{"u":{},"w":{}}'),
async run(a,d){const db=L.db(),sv=()=>ls.set('wl-db',JSON.stringify(db));
 if(a==='register'){if(!d.name||!d.bd||!d.email||(d.pw||'').length<6)return{error:'Bitte Name, Geburtstag, E-Mail und Passwort (min. 6 Zeichen) angeben'};
  if(db.u[d.email])return{error:'E-Mail ist schon registriert'};const slug=Math.random().toString(36).slice(2,10).padEnd(8,'x');
  db.u[d.email]={pw:d.pw,slug};db.w[slug]={slug,name:d.name,bd:d.bd,items:[]};sv();return{token:d.email,slug}}
 if(a==='login'){const u=db.u[d.email];if(!u||u.pw!==d.pw)return{error:'E-Mail oder Passwort falsch'};return{token:d.email,slug:u.slug}}
 if(a==='get')return db.w[d.slug]||{error:'Liste nicht gefunden'};
 if(a==='save'){const u=db.u[d.token];if(!u)return{error:'Nicht angemeldet'};db.w[u.slug].items=d.items;sv();return{ok:true}}
 return{error:'?'}}};
async function api(a,d={}){
 if(remote===null){try{remote=(await R('ping',{})).ok===true}catch{remote=false}}
 return remote?R(a,d):L.run(a,d)}

/* ---- State & Routing ---- */
let tok=ls.get('wl-tok')||'',mySlug=ls.get('wl-slug')||'',rid=0;
const routeOf=()=>{const s=(location.hash.slice(2)||location.pathname.slice(1)).toLowerCase();return s==='edit'||/^[a-z0-9]{6,12}$/.test(s)?s:''};
const go=s=>{if(remote)history.pushState(0,'',s?'/'+s:'/');else location.hash=s?'#/'+s:'';render()};
const days=bd=>{const[,m,d]=bd.split('-').map(Number),n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),t=new Date(n.getFullYear(),m-1,d);if(t<t0)t.setFullYear(t.getFullYear()+1);return Math.round((t-t0)/864e5)};
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r('');i.src=u});

const burst=e=>{for(let i=0;i<16;i++){const p=h('span',{class:'p',style:`left:${e.clientX}px;top:${e.clientY}px;--dx:${(Math.random()-.5)*320}px;--dy:${-Math.random()*260-40}px`},['🎉','✨','🎁','💖'][i%4]);document.body.append(p);setTimeout(()=>p.remove(),1000)}};
function nav(show=true){$('#nav').replaceChildren(...(tok&&show?[h('button',{class:'g',onclick:()=>go(mySlug)},'Liste ansehen'),' ',h('button',{class:'g',onclick:()=>{tok=mySlug='';ls.del('wl-tok');ls.del('wl-slug');go('')}},'Abmelden')]:[]))}

function auth(app){
 let reg=false;const box=h('div',{class:'box auth'});
 const draw=()=>{
  const N=h('input',{placeholder:'Dein Name'}),B=h('input',{type:'date'}),E=h('input',{type:'email',placeholder:'E-Mail'}),W=h('input',{type:'password',placeholder:'Passwort (min. 6 Zeichen)'}),msg=h('p',{class:'mu'});
  const submit=async e=>{burst(e);const r=await api(reg?'register':'login',{name:N.value.trim(),bd:B.value,email:E.value.trim().toLowerCase(),pw:W.value});
   if(r.error)return msg.textContent=r.error;tok=r.token;mySlug=r.slug;ls.set('wl-tok',tok);ls.set('wl-slug',mySlug);go('edit')};
  rc(box,h('h2',{},reg?'Eigene Wunschliste erstellen':'Anmelden'),reg&&N,reg&&h('label',{class:'mu'},'Dein Geburtstag',B),E,W,msg,h('button',{onclick:submit},reg?'Registrieren':'Anmelden'),h('p',{},h('a',{href:'#',onclick:e=>{e.preventDefault();reg=!reg;draw()}},reg?'Schon ein Konto? Anmelden':'Neu hier? Eigene Liste erstellen')))};
 draw();app.append(h('div',{class:'c'},h('h1',{},'🎁 Wunschliste'),h('p',{class:'mu'},'Erstelle deine Wunschliste und teile den Link mit Freunden.')),box)}

const num=p=>{const n=parseFloat(String(p||'').replace(/[^\d,.]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));return isNaN(n)?Infinity:n};
const eur=p=>{p=String(p||'').trim();return p&&!p.includes('€')?p+' €':p};
function view(app,w,own){
 const n=days(w.bd),[,m,d]=w.bd.split('-'),url=remote?location.origin+'/'+w.slug:location.href.split('#')[0]+'#/'+w.slug;
 app.append(h('div',{class:'c'},h('h1',{},'🎂 Wunschliste von '+w.name),h('p',{class:'mu',style:'animation:in .8s both'},n?`Noch ${n} Tage bis zum Geburtstag am ${+d}.${+m}.`:'🎉 Heute ist Geburtstag! 🎉')));
 const save=()=>api('save',{token:tok,items:w.items}),g=h('div',{class:'grid'}),note=h('p',{class:'mu c'});
 const draw=()=>{
  const list=[...w.items].sort((a,b)=>{const A=num(a.price),B=num(b.price);return A===B?0:A-B});
  note.textContent=list.length>1?'Sortiert nach Preis: günstig → teuer':list.length?'':'Noch keine Wünsche – bald gibt es hier was zu sehen ✨';
  g.replaceChildren(...(list.length?list.map((it,i)=>{
   const im=h('div',{class:'im'},okImg(it.img)?'':'🎁');if(okImg(it.img))im.style.backgroundImage=`url("${it.img.replace(/"/g,'%22')}")`;
   return h('div',{class:'card',style:`animation-delay:${i*70}ms`},h('span',{class:'n'},'#'+(i+1)),
    own&&h('button',{class:'x',title:'Löschen',onclick:async()=>{w.items=w.items.filter(x=>x!==it);await save();draw()}},'✕'),im,
    h('div',{class:'b'},h('strong',{},it.title),it.price&&h('span',{class:'mu'},eur(it.price)),ok(it.link)&&h('a',{class:'btn',href:it.link,target:'_blank',rel:'noopener noreferrer'},'Zum Shop ↗')))
  }):[]))};
 if(own){
  const T=h('input',{placeholder:'Produkt *'}),Lk=h('input',{placeholder:'Link zum Shop'}),P=h('input',{placeholder:'Preis (z.B. 49,99)'}),I=h('input',{placeholder:'Bild-URL (optional)'}),F=h('input',{type:'file',accept:'image/*'});
  P.addEventListener('blur',()=>{P.value=eur(P.value)});
  app.append(h('div',{class:'box'},h('h3',{},'Wunsch hinzufügen'),h('div',{class:'row'},T,Lk,P,I),h('label',{class:'mu'},'oder Bild hochladen ',F),h('p',{},h('button',{onclick:async e=>{burst(e);
   const t=T.value.trim();if(!t)return T.focus();let img=I.value.trim(),l=Lk.value.trim();if(l&&!ok(l))l='https://'+l;if(F.files[0])img=await shrink(F.files[0]);
   w.items.push({id:Date.now(),title:t,link:l,price:eur(P.value),img});await save();[T,Lk,P,I,F].forEach(x=>x.value='');draw()}},'Hinzufügen')),
   h('p',{class:'mu'},'Link zum Teilen (Besucher sehen nur die Liste, ohne Anmeldung):'),h('input',{readonly:'',value:url,onclick:e=>e.target.select()}),
   h('div',{class:'row'},h('button',{onclick:async e=>{try{await navigator.clipboard.writeText(url);e.target.textContent='Kopiert ✓'}catch{e.target.textContent='Link markieren & kopieren'}}},'Link kopieren'),h('button',{class:'g',onclick:()=>go(w.slug)},'So sehen Besucher die Liste'))))}
 app.append(note,g);draw();
 g.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg) translateY(-6px)`});
 g.addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c)c.style.transform=''})}

async function render(){
 const id=++rid,app=$('#app'),r=routeOf(),pub=r&&r!=='edit';nav(!pub);
 if(r==='edit'&&!tok)return go('');
 if(!r){app.replaceChildren();if(tok&&mySlug)return go('edit');return auth(app)}
 const w=await api('get',{slug:pub?r:mySlug});if(id!==rid)return;app.replaceChildren();
 if(w.error)return app.append(h('p',{class:'c'},'😕 '+w.error));
 view(app,w,!pub)}

$('#logo').onclick=()=>go(tok?'edit':'');
addEventListener('hashchange',render);addEventListener('popstate',render);
['🎁','🎈','🎂','🎉','✨','🎀'].flatMap(x=>[x,x]).forEach(e=>document.body.append(h('span',{class:'f',style:`left:${Math.random()*95}%;animation-duration:${12+Math.random()*14}s;animation-delay:-${Math.random()*20}s`},e)));
render();
</script></body></html>

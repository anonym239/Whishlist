<style>
:root{--bg:#fbf9f1;--sf:#ffffff;--sf2:#f3f0e5;--tx:#1b1a17;--mu:#6b675d;--bd:#e5e0d0;--bd2:#d6d0bd;--ac:#ead9ff;--acb:#1b1a17;--act:#1b1a17;--gr:#0e4b3b;--gold:#c8961e;--sh:0 1px 2px rgba(27,26,23,.04),0 8px 24px rgba(27,26,23,.06);--serif:"EB Garamond",Georgia,"Times New Roman",serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--sf:#1b1a18;--sf2:#24221f;--tx:#f2eee3;--mu:#a39e90;--bd:#302e29;--bd2:#45423b;--ac:#d9c4ff;--acb:#d9c4ff;--act:#16141a;--gr:#1d6a54;--gold:#e0b44a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--sf:#1b1a18;--sf2:#24221f;--tx:#f2eee3;--mu:#a39e90;--bd:#302e29;--bd2:#45423b;--ac:#d9c4ff;--acb:#d9c4ff;--act:#16141a;--gr:#1d6a54;--gold:#e0b44a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--sans);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Kopfzeile wie eine schwebende Leiste */
header{position:sticky;top:0;z-index:15;padding:14px 16px 0}
.hd{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 7px 7px 16px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
#nav{display:flex;gap:6px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.logo svg.i{width:22px;height:22px;stroke-width:2}
/* Knöpfe */
button,.btn{font:inherit;font-weight:600;font-size:15px;border:1.5px solid var(--acb);border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;background:var(--ac);color:var(--act);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 -1px var(--acb)}
button:active,.btn:active{transform:translateY(0);box-shadow:none}
button:focus-visible,.btn:focus-visible,a:focus-visible,.logo:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
button.g,.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd2)}
button.g:hover,.btn.g:hover{background:var(--sf2);box-shadow:none;border-color:var(--bd2)}
button.icon{padding:8px;width:40px;min-height:40px}
main{max-width:1000px;margin:0 auto;padding:10px 20px 70px;position:relative}
.c{text-align:center}.mu{color:var(--mu)}
/* Typografie */
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:56px 0 14px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7.2vw,78px);line-height:1;letter-spacing:-.025em;margin:0 0 18px;overflow-wrap:anywhere;animation:in .7s both}
h1 em{font-style:italic;font-weight:400}
h2{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.01em;margin:0 0 14px;line-height:1.1}
h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.lead{font-size:18px;max-width:440px;margin:0 auto 6px;line-height:1.45}
/* Flächen */
.box{max-width:760px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:24px;margin:16px auto;box-shadow:var(--sh);animation:in .5s both}
.box>h3+p.mu{margin-top:0}
.auth{max-width:420px;margin-top:28px}
.auth h2{text-align:center}
.auth label{display:block;margin-top:6px;font-size:14px;font-weight:600;color:var(--tx)}
.wide{width:100%;margin-top:10px;padding:13px;font-size:16px}
.links{text-align:center;line-height:2.1;font-size:14.5px;margin-bottom:0}
.links a,.foot a{color:var(--tx);font-weight:600;text-decoration:underline;text-decoration-color:var(--bd2);text-underline-offset:3px}
.links a:hover,.foot a:hover{text-decoration-color:var(--tx)}
input,select{font:inherit;font-size:16px;width:100%;min-height:46px;padding:11px 14px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg);color:var(--tx);margin:5px 0;outline:0;transition:box-shadow .15s,border-color .15s}
input::placeholder{color:var(--mu);opacity:.8}
select option{background:var(--sf);color:var(--tx)}
input[type=file]{min-height:auto;padding:8px}
input[type=file]::file-selector-button{font:inherit;font-weight:600;border:1px solid var(--bd2);border-radius:8px;padding:7px 14px;margin-right:12px;cursor:pointer;color:var(--tx);background:var(--sf2)}
input:focus,select:focus{border-color:var(--tx);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 70%,transparent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.lf{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
/* Countdown */
.cd{display:flex;gap:10px;justify-content:center;margin:22px 0 6px;animation:in .8s both}
.cd div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 6px 8px;min-width:78px;box-shadow:var(--sh)}
.cd b{display:block;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.party{display:inline-flex;align-items:center;gap:8px;background:var(--gr);color:#fff;font-weight:600;font-size:18px;padding:10px 22px;border-radius:99px}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.chip.dk{background:var(--gr);border-color:var(--gr);color:#fff}
.hint{max-width:560px;margin:8px auto}
/* Sterne */
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.st,.cst{background:none;box-shadow:none!important;border:0;padding:2px 4px;min-height:auto;width:auto;color:var(--bd2);font-size:28px;line-height:1;transform:none!important}
.cst{font-size:20px}
.st.on,.cst.on{color:var(--gold)}
.st:hover,.cst:hover{color:var(--gold)}
.pri{color:var(--gold);letter-spacing:2px;font-size:15px}
/* Karten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:22px}
.empty{grid-column:1/-1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;animation:in .5s backwards;transition:transform .2s,box-shadow .2s,opacity .2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.card[draggable=true]{cursor:grab}
.card.drag{opacity:.4}
.card.over{outline:2px dashed var(--tx);outline-offset:3px}
.card.res .im{filter:grayscale(1);opacity:.55}
.im{aspect-ratio:4/3;background:var(--sf2) center/cover;display:grid;place-items:center;color:var(--bd2);border-bottom:1px solid var(--bd)}
.im svg.i{width:48px;height:48px;stroke-width:1.2}
.rib{position:absolute;top:10px;right:10px;z-index:2;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;padding:6px 14px;border-radius:99px;font-weight:600;font-size:13.5px;color:#fff;background:var(--gr);box-shadow:0 6px 16px rgba(0,0,0,.18);animation:in .4s both}
.b{padding:16px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;flex:1}
.b strong{font-size:16.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.price{font-family:var(--serif);font-size:22px;line-height:1.2}
.b .btn,.b .rbtn{margin-top:auto;width:100%}
.b>.btn{margin-top:auto}
.b .btn+.rslot{margin-top:6px}
.rslot{width:100%;margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.rslot input{margin:0;min-height:42px;padding:8px 12px}
.card.top{border:2px solid var(--acb);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 70%,transparent)}
.im{position:relative}
.topb{position:absolute;left:10px;bottom:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 9px;border-radius:99px;background:var(--ac);color:var(--act);border:1.5px solid var(--acb);font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.topb svg.i{width:15px;height:15px;stroke-width:2.2}
.note{margin:2px 0 4px;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.3;color:var(--mu);overflow-wrap:anywhere}
textarea{font:inherit;font-size:16px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg);color:var(--tx);margin:5px 0;outline:0;resize:vertical;min-height:70px}
textarea:focus{border-color:var(--tx);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 70%,transparent)}
.sw{width:100%;justify-content:flex-start;gap:12px;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd2);padding:12px 14px;margin:10px 0 4px;font-weight:500}
.sw:hover{box-shadow:none;transform:none;background:var(--sf2)}
.sw.on{background:var(--ac);color:var(--act);border-color:var(--acb)}
.swi{width:36px;height:36px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;flex:none}
.sw.on .swi{background:var(--sf);color:#c2410c}
.swt{flex:1;display:flex;flex-direction:column;min-width:0}
.swt small{font-weight:400;font-size:12.5px}.sw.on .swt small{color:var(--act);opacity:.75}
.knob{width:44px;height:26px;border-radius:99px;background:var(--bd2);position:relative;flex:none;transition:background .2s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on .knob{background:var(--tx)}.sw.on .knob::after{transform:translateX(18px)}
.xbtn{margin-top:auto;width:100%}
.xbtn svg.i{width:16px;height:16px;stroke-width:2.2}
body.noscroll{overflow:hidden}
.sheetbg{position:fixed;inset:0;z-index:200;background:rgba(15,14,12,.5);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s both}
.sheet{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:100%;max-width:520px;max-height:min(86vh,760px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:in .25s both}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 18px 12px;border-bottom:1px solid var(--bd)}
.shead h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1;margin:2px 0 0;overflow-wrap:anywhere}
.xk{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.sbody{overflow-y:auto;padding:12px 18px;display:grid;gap:10px;overscroll-behavior:contain}
.xrow{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.xrow.main{border-color:var(--bd2)}
.xth{width:64px;height:64px;flex:none;border-radius:10px;background:var(--sf2) center/cover;border:1px solid var(--bd);display:grid;place-items:center;color:var(--bd2)}
.xth svg.i{width:26px;height:26px;stroke-width:1.4}
.xt{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere;line-height:1.3}.xt b{font-weight:600;font-size:15px}.xt small{font-size:12.5px}
.xp{font-family:var(--serif);font-size:18px;white-space:nowrap}
.btn.xs{min-height:38px;padding:6px 12px;font-size:13.5px;flex:none}
.xsep{margin:6px 2px 0;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.sfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
@keyframes fade{from{opacity:0}}
@media (max-width:560px){
 .sheetbg{align-items:flex-end;padding:0}
 .sheet{max-width:none;border-radius:18px 18px 0 0;max-height:88vh;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
 .xth{width:54px;height:54px}
 .xbtn{font-size:13px;padding:8px 6px;gap:5px}
}
@keyframes up{from{transform:translateY(100%)}}
.prev.sm{width:76px;height:76px}
.exsum{display:none;align-items:center;gap:10px}
.exrow.closed{padding:8px}.exrow.closed .exsum{display:flex}.exrow.closed .exbody{display:none}
.exsum .xth{width:46px;height:46px}.exsum .xth svg.i{width:20px;height:20px}
.exsum .icon{width:38px;min-height:38px}
.exact{justify-content:flex-start;margin:6px 0 0}
.exrow .fld small{display:none}
@media (max-width:560px){
 .exrow{padding:4px 10px 10px}
 .exrow .form2{grid-template-columns:1fr 1fr;gap:0 10px}
 .exrow .fl{font-size:12.5px}
 .exrow input{min-height:42px;padding:9px 10px;font-size:15px}
 .exrow .prev.sm{width:64px;height:64px}
 .lg{display:none}
 .note{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
.xin{flex:1;min-width:0}
.exbox{margin:12px 0 4px;padding:14px;border:1px dashed var(--bd2);border-radius:12px}
.exbox>small{display:block;font-size:12.5px;margin-bottom:6px}
.exrows{display:grid;gap:10px;margin:8px 0}
.exrow{padding:4px 12px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.exrow .exdel{min-height:36px;padding:4px 12px;font-size:13.5px;margin-top:4px}
.exrow .exdel svg.i{width:14px;height:14px}
.chipbox{width:100%;margin:6px 0 4px;display:flex;flex-direction:column;gap:3px}
.cbar{height:8px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);overflow:hidden}
.cbar span{display:block;height:100%;background:var(--gr);border-radius:99px;transition:width .4s}
.chipbox small{font-size:12.5px;line-height:1.3}.chipbox small:first-of-type{font-weight:600}
.cby{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rbtn.soft{border:0;background:none;min-height:30px;padding:2px;font-size:13px;font-weight:500;color:var(--mu);text-decoration:underline;text-underline-offset:3px}
.rbtn.soft:hover{color:var(--tx);background:none}
.gotb{gap:6px}.gotb svg.i{width:16px;height:16px;stroke-width:2.4}
.mv{align-items:stretch}.mv .gotb{flex:1.6}
.gotrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.gotrow .xth{width:46px;height:46px;filter:grayscale(.6)}.gotrow .icon{width:38px;min-height:38px}
.gotbox .full{margin-top:14px}
.after{border-color:var(--gr)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0 0}
.fchip{min-height:36px;padding:6px 14px;font-size:14px;font-weight:600;border-radius:99px;background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.fchip:hover{transform:none;box-shadow:none;border-color:var(--bd2)}
.fchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.xact{display:flex;flex-direction:column;gap:6px;flex:none}
.xres{font-size:12.5px;font-weight:600;color:var(--gr)}
:root[data-theme="dark"] .xres{color:#5fd0a8}
.xrow.taken .xth{filter:grayscale(1);opacity:.6}
.xname{display:grid;gap:4px}.xname input{margin:0;min-height:42px}.xname small{font-size:12.5px}
.sitefoot{max-width:1000px;margin:0 auto;padding:10px 20px 34px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mu)}
.sitefoot a{color:var(--mu);text-underline-offset:3px}
body.hastabs .sitefoot{padding-bottom:110px}
@media (max-width:760px){body.hastabs main{padding-bottom:20px}}
.rnote{font-size:12px;line-height:1.35}
.mv{display:flex;gap:6px;width:100%;padding-top:10px}
.mv button{flex:1;min-height:36px;padding:4px}
.n{position:absolute;top:10px;left:10px;z-index:2;font-weight:600;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);color:var(--mu)}
.x{position:absolute;top:8px;right:8px;width:32px;min-height:32px;padding:0;border-radius:99px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);z-index:2}
.x.ed{right:46px}.x.ed:hover{background:var(--sf2);border-color:var(--bd2);color:var(--tx)}
.x:not(.ed):hover{background:#fbe9e7;border-color:#e3a59b;color:#a8321f;box-shadow:none}
.x svg.i{width:15px;height:15px}
.qr{display:flex;justify-content:center;margin-top:10px}
.qr:not(:empty){padding:14px;background:#fff;border:1px solid var(--bd);border-radius:14px;width:max-content;margin:12px auto 0}
.qr img,.qr canvas{display:block}
.preview{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;max-width:620px;margin:16px auto;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:var(--tx);color:var(--bg);font-weight:500;padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:in .25s both;max-width:calc(100% - 32px)}
.shake{animation:shake .4s both!important}
.rain{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.small{font-size:14px}

function pub(app,w){
 const preview=myLists().includes(w.slug); // Besitzer schaut sich seine eigene Liste an -> Reservierungen verstecken
 if(preview)w.items.forEach(i=>{i.res=false;delete i.by;i.parts=[];(i.extras||[]).forEach(x=>{x.res=false;delete x.by})});
 const url=urlOf(w.slug);document.title=`Wunschliste von ${w.name}`;
 app.append(head(w));
 if(preview)app.append(h('div',{class:'preview c noprint'},'So sehen deine Freunde die Liste. Reservierungen bleiben für dich geheim. ',h('a',{href:'#',style:'color:var(--tx);font-weight:700',onclick:e=>{e.preventDefault();go('edit')}},'Zurück zum Bearbeiten')));
 const stats=h('div',{class:'stats'}),filt=h('div',{class:'fchips noprint',role:'group','aria-label':'Nach Preis filtern'}),g=h('div',{class:'grid'});
 const B=[['all','Alle',()=>true],['20','bis 20 €',p=>p<=20],['50','20–50 €',p=>p>20&&p<=50],['100','50–100 €',p=>p>50&&p<=100],['more','über 100 €',p=>p>100&&isFinite(p)]];
 let flt=ls.get('wl-flt:'+w.slug)||'all';
 const refresh=async()=>{const n=await api('get',{slug:w.slug});if(!n.error){w.items=n.items;draw()}};
 const pv=p=>isFinite(num(p))?num(p):0,isFull=i=>{const t=num(i.price);return isFinite(t)&&t>0&&(i.parts||[]).reduce((s,p)=>s+(+p.amt||0),0)>=t};
 const draw=()=>{
  const all=[...w.items].sort((a,b)=>(b.top?1:0)-(a.top?1:0)||(b.pri||0)-(a.pri||0)||((num(a.price)-num(b.price))||0));
  const used=B.filter(([k,,f])=>k!=='all'&&all.some(i=>f(num(i.price))));
  if(!used.some(([k])=>k===flt))flt='all';
  const list=all.filter(i=>B.find(([k])=>k===flt)[2](num(i.price)));
  const r=w.items.filter(i=>i.res||isFull(i)).length;
  put(stats,h('span',{class:'chip'},`${w.items.length} ${w.items.length===1?'Wunsch':'Wünsche'}`),!preview&&w.items.length&&h('span',{class:'chip'},`${r} von ${w.items.length} vergeben`));
  put(filt,used.length>1&&[['all','Alle'],...used].map(([k,l])=>h('button',{class:'fchip'+(k===flt?' on':''),'aria-pressed':String(k===flt),onclick:()=>{flt=k;ls.set('wl-flt:'+w.slug,k);draw()}},l)));
  if(!all.length)return put(g,h('p',{class:'mu c empty'},'Noch keine Wünsche – bald gibt es hier was zu sehen ✨'));
  if(!list.length)return put(g,h('p',{class:'mu c empty'},'In dieser Preisklasse gibt es nichts.'));
  put(g,list.map((it,i)=>card(it,i,{pub:!preview,slug:w.slug,owner:w.name,
   onRes:async(e,on,by)=>{const key=`wl-r:${w.slug}:${it.id}`;
    const r=await api('guest',{op:'res',slug:w.slug,id:it.id,on,by:on?by:'',key:ls.get(key)||''});if(r.error){toast(r.error);return refresh()}
    it.res=on;if(on&&by)it.by=by;else delete it.by;on?ls.set(key,r.key||'1'):ls.del(key);if(on){burst(e);toast(by?`Danke, ${by}! Reserviert 🎉`:'Reserviert – danke! 🎉')}draw()},
   onChip:async(e,on,by,amt)=>{const key=`wl-c:${w.slug}:${it.id}`;let mp=null;try{mp=JSON.parse(ls.get(key)||'null')}catch{}
    const r=await api('guest',{op:'chip',slug:w.slug,id:it.id,on,by:on?by:'',amt,pid:mp?.pid||'',key:mp?.key||''});if(r.error){toast(r.error);if(!/Betrag/.test(r.error))refresh();return}
    if(on){ls.set(key,JSON.stringify({pid:r.pid,key:r.key}));it.parts=[...(it.parts||[]),{pid:r.pid,amt:Math.round(Number(String(amt).replace(',','.'))*100)/100,...(by?{by}:{})}];toast(by?`Danke, ${by}! Du bist dabei 🎉`:'Danke! Du bist dabei 🎉')}
    else{it.parts=(it.parts||[]).filter(p=>p.pid!==mp?.pid);ls.del(key);toast('Anteil zurückgenommen')}draw()},
   onXRes:async(it2,x,on)=>{const key=`wl-r:${w.slug}:${it2.id}:${x.xid}`,by=ls.get('wl-gname')||'';
    const r=await api('guest',{op:'res',slug:w.slug,id:it2.id,xid:x.xid,on,by:on?by:'',key:ls.get(key)||''});if(r.error){toast(r.error);refresh();return false}
    x.res=on;if(on&&by)x.by=by;else delete x.by;on?ls.set(key,r.key||'1'):ls.del(key);toast(on?'Zubehör reserviert – danke!':'Reservierung aufgehoben');draw();return true}})))};
 app.append(stats,
  !preview&&w.items.length&&h('div',{class:'how noprint'},h('span',{},h('b',{},'1'),' Geschenk aussuchen'),h('span',{},h('b',{},'2'),' „Ich besorge das“ tippen'),h('span',{},h('b',{},'3'),' Im Shop kaufen')),
  !preview&&w.items.length&&h('p',{class:'mu c small noprint'},`${w.name} sieht nicht, wer was reserviert hat. Teure Wünsche könnt ihr auch zusammenlegen.`),
  filt,g,
  h('div',{class:'box noprint',style:'margin-top:30px'},h('h3',{},'Liste weiterleiten'),h('p',{class:'mu small'},'Schick die Liste an andere Gäste oder die Familie.'),
   shareButtons(`🎁 Schau mal, das wünscht sich ${w.name} ${forWhat(w)}: ${url}`,url,'Wunschliste von '+w.name)),
  h('p',{class:'c foot noprint',style:'margin-top:24px'},h('a',{href:'#',onclick:e=>{e.preventDefault();go(tok?'edit':'')}},tok?'Zu meinen Listen →':'Eigene Wunschliste erstellen →')));
 draw()}

/* ---------- Bild verkleinern ---------- */
const shrink=(f,max=480)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>{URL.revokeObjectURL(u);r('')};i.src=u});

/* ---------- Seite aufbauen ---------- */
async function render(){
 document.title='Wunschliste – Wünsche sammeln & teilen';const id=++rid,app=$('#app');clearInterval(timer);document.body.classList.remove('hastabs');await detect();if(id!==rid)return;
 const r=routeOf();pubView=!!r&&r!=='edit';nav();
 if(r==='edit'){if(!tok)return go('');return owner(app,id)}
 if(!r){app.replaceChildren();if(tok)return go('edit');return auth(app)}
 const w=await api('get',{slug:r});if(id!==rid)return;app.replaceChildren();
 if(w.error)return app.append(h('div',{class:'box c'},h('p',{},'😕 '+w.error),h('button',{onclick:()=>go('')},'Zur Startseite')));
 pub(app,w)}

$('#logo').onclick=()=>go(tok?'edit':'');
$('#logo').onkeydown=e=>{if(e.key==='Enter')go(tok?'edit':'')};
addEventListener('hashchange',render);addEventListener('popstate',render);
$('#lg').append(ico('gift'));
render();
// Offline-Unterstützung & Installierbarkeit (nur auf der echten Seite, nicht in der Vorschau)
detect().then(()=>{if(remote&&'serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})});
</script></body></html>

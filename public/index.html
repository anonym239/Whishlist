<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0a18">
<title>Wunschliste 🎁</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff3ec;--card:#ffffffb8;--tx:#2b2230;--mu:#7a6f80;--ac:#ff3d81;--ac2:#ffa63d;--ac3:#7c4dff;--bd:#ffffffd9;--in:#ffffffcc;--gold:#ffb400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a18;--card:#1d1530a6;--tx:#f6f0ff;--mu:#aa9cc0;--bd:#ffffff1f;--in:#ffffff12}}
:root[data-theme="dark"]{--bg:#0e0a18;--card:#1d1530a6;--tx:#f6f0ff;--mu:#aa9cc0;--bd:#ffffff1f;--in:#ffffff12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
body::before,body::after{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(50px)}
body::before{background:radial-gradient(35% 35% at 20% 25%,rgba(255,61,129,.40),transparent),radial-gradient(35% 35% at 80% 30%,rgba(124,77,255,.38),transparent);animation:drift 16s ease-in-out infinite alternate}
body::after{background:radial-gradient(40% 40% at 55% 85%,rgba(255,166,61,.38),transparent),radial-gradient(30% 30% at 10% 80%,rgba(0,200,255,.25),transparent);animation:drift 22s ease-in-out infinite alternate-reverse}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:var(--in);border-bottom:1px solid var(--bd)}
#nav{display:flex;gap:8px;align-items:center}
.logo{font-weight:800;font-size:20px;cursor:pointer;white-space:nowrap;background:linear-gradient(90deg,var(--ac),var(--ac3),var(--ac2),var(--ac));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
button,.btn{font:inherit;border:0;border-radius:14px;padding:11px 18px;min-height:44px;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,opacity .25s;box-shadow:0 6px 18px rgba(255,61,129,.35)}
button::after,.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);transition:left .6s}
button:hover::after,.btn:hover::after{left:130%}
button:hover,.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 28px rgba(124,77,255,.45)}
button:active,.btn:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
button.g{background:var(--in);color:var(--tx);border:1px solid var(--bd);box-shadow:none;backdrop-filter:blur(10px)}
button.icon{padding:8px 12px;font-size:18px}
main{max-width:1000px;margin:0 auto;padding:10px 20px 60px;position:relative;z-index:1}
.c{text-align:center}.mu{color:var(--mu)}
h1{font-size:clamp(28px,6vw,48px);margin:18px 0 4px;font-weight:900;overflow-wrap:anywhere;background:linear-gradient(90deg,var(--ac),var(--ac3),var(--ac2),var(--ac));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:in .8s both,shine 7s linear infinite}
h3{margin:4px 0 12px}
.box{text-align:center;max-width:760px;background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:24px;padding:22px;margin:18px auto;box-shadow:0 20px 50px rgba(124,77,255,.15);animation:in .7s both}
.auth{max-width:400px;animation:in .7s both,float 6s ease-in-out 1s infinite}
.auth label{display:block;text-align:left;margin-top:6px}
.wide{width:100%;margin-top:6px;padding:14px;font-size:17px;animation:pulse 2.4s ease-in-out infinite}
.links a,.foot a{color:var(--ac);font-weight:600}
.links{line-height:2}
input,select{text-align:center;text-align-last:center;font:inherit;width:100%;min-height:44px;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);margin:5px 0;outline:0;transition:box-shadow .25s,border-color .25s,transform .25s}
select option{background:var(--bg);color:var(--tx)}
input[type=file]{min-height:auto;padding:8px}
input[type=file]::file-selector-button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 16px;margin-right:12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac3))}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(255,61,129,.2);transform:scale(1.015)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tools select{width:auto;flex:1 1 220px;margin:0}
.bar{padding:14px}
.lf{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);animation:in .4s both}
/* Countdown */
.cd{display:flex;gap:10px;justify-content:center;margin:10px 0 6px;animation:in .9s both}
.cd div{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:16px;padding:8px 6px;min-width:70px}
.cd b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--ac),var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent}
.cd span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.party{font-size:clamp(22px,5vw,32px);font-weight:900;animation:bounce 1s ease-in-out infinite}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-weight:600;backdrop-filter:blur(10px)}
.hint{max-width:560px;margin:8px auto}
/* Sterne */
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.st,.cst{background:none;box-shadow:none;border:0;padding:2px 4px;min-height:auto;color:var(--mu);opacity:.5;font-size:28px;line-height:1}
.cst{font-size:20px}
.st::after,.cst::after{display:none}
.st.on,.cst.on{color:var(--gold);opacity:1;text-shadow:0 0 12px rgba(255,180,0,.6)}
.st:hover,.cst:hover{transform:scale(1.25) rotate(-8deg);box-shadow:none}
.pri{color:var(--gold);letter-spacing:2px;text-shadow:0 0 10px rgba(255,180,0,.5)}
/* Karten */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,290px));justify-content:center;gap:22px;margin-top:18px}
.empty{grid-column:1/-1}
.card{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;animation:card .7s cubic-bezier(.2,.9,.3,1.2) backwards;transition:transform .15s ease-out,box-shadow .3s,opacity .3s;position:relative}
.card:hover{box-shadow:0 22px 44px rgba(124,77,255,.3)}
.card[draggable=true]{cursor:grab}
.card.drag{opacity:.4}
.card.over{outline:3px dashed var(--ac);outline-offset:4px}
.card.res .im{filter:grayscale(.8) brightness(.75)}
.im{height:190px;background:linear-gradient(135deg,rgba(255,61,129,.25),rgba(124,77,255,.25)) center/cover;display:grid;place-items:center;font-size:60px}
.rib{position:absolute;top:80px;left:50%;transform:translateX(-50%) rotate(-6deg);z-index:2;white-space:nowrap;padding:6px 14px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#1db954,#0aa36b);box-shadow:0 8px 20px #0005;animation:pop2 .5s cubic-bezier(.2,.9,.3,1.4) both}
.b{padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;flex:1}
.b strong{font-size:17px;overflow-wrap:anywhere}
.b .btn,.b .rbtn{margin-top:auto;width:100%}
.b .btn+.rbtn{margin-top:4px}
.mv{display:flex;gap:6px;width:100%}
.mv button{flex:1;min-height:36px;padding:4px}
.n{position:absolute;top:10px;left:10px;z-index:2;font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px;background:#000b;color:#fff}
.x{position:absolute;top:10px;right:10px;padding:4px 11px;min-height:auto;background:#000b;box-shadow:none;z-index:2}
.qr{display:flex;justify-content:center;margin-top:10px}
.qr:not(:empty){padding:14px;background:#fff;border-radius:18px;width:max-content;margin:12px auto 0;animation:pop2 .5s cubic-bezier(.2,.9,.3,1.4) both}
.qr img,.qr canvas{display:block}
.preview{background:linear-gradient(135deg,rgba(255,61,129,.2),rgba(124,77,255,.2));border:1px solid var(--bd);border-radius:16px;padding:10px 14px;max-width:560px;margin:12px auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:#2b2230;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 10px 30px #0006;animation:in .3s both}
.shake{animation:shake .45s both!important}
.f{position:fixed;top:-40px;font-size:24px;opacity:.5;animation:fall linear infinite;pointer-events:none;z-index:0}
.rain{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:50;animation:fall linear forwards}
.p{position:fixed;z-index:99;pointer-events:none;font-size:22px;animation:pop 1s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes card{from{opacity:0;transform:translateY(40px) scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes drift{to{transform:translate(8%,6%) scale(1.15) rotate(8deg)}}
@keyframes shine{to{background-position:300% 0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bounce{50%{transform:translateY(-8px) scale(1.05)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,61,129,0),0 10px 28px rgba(255,61,129,.55)}}
@keyframes pop{to{transform:translate(var(--dx),calc(var(--dy) + 220px)) rotate(540deg);opacity:0}}
@keyframes pop2{from{opacity:0;transform:translateX(-50%) scale(.3) rotate(-20deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.qr:not(:empty){animation-name:in}
/* Handy & Tablet */
@media (hover:none){button:hover,.btn:hover{transform:none}.card:hover{box-shadow:none}}
@media (max-width:900px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:640px;margin-left:auto;margin-right:auto}
 .row{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
 header{padding:10px 12px}
 .logo{font-size:17px}
 #nav{gap:6px}
 #nav button{padding:7px 10px;font-size:14px;min-height:38px}
 main{padding:6px 14px 40px}
 h1{font-size:clamp(24px,8vw,32px);margin-top:12px}
 .box{padding:18px 14px;border-radius:20px;margin:14px auto}
 .row{grid-template-columns:1fr}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .im{height:130px;font-size:44px}
 .rib{top:56px;font-size:12px;padding:4px 10px}
 .b{padding:10px;gap:4px}
 .b strong{font-size:15px}
 .b .btn,.b .rbtn{padding:9px 6px;font-size:14px}
 .cd{gap:6px}.cd div{min-width:0;flex:1;max-width:76px}.cd b{font-size:22px}.cd span{font-size:10px}
 .cst{font-size:18px;padding:2px}
 .f{font-size:18px}
 body::before,body::after{filter:blur(36px)}
}
#nav button{white-space:nowrap}
@media (max-width:430px){.lt{display:none}.logo{font-size:24px}}
@media (max-width:360px){.grid{grid-template-columns:1fr}.im{height:170px}#nav .acc{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Drucken / PDF */
@media print{
 header,.f,.p,.rain,.x,.mv,.noprint,.toast,button{display:none!important}
 body{background:#fff;color:#000}body::before,body::after{display:none}
 h1{background:none;color:#000;-webkit-text-fill-color:#000;animation:none}
 .card{break-inside:avoid;background:#fff;border:1px solid #ccc;box-shadow:none;backdrop-filter:none;animation:none}
 .grid{grid-template-columns:repeat(3,1fr)}
 .btn{display:block;color:#000;background:none;box-shadow:none;font-weight:400;font-size:11px;overflow-wrap:anywhere}
 .btn::before{content:attr(href)}.btn{font-size:0}.btn::before{font-size:10px}
 .cd div,.chip{background:#fff;border-color:#ccc}
}
</style></head>
<body>
<header><div class="logo" id="logo" role="link" tabindex="0" aria-label="Wunschliste – Startseite">🎁<span class="lt"> Wunschliste</span></div><div id="nav"></div></header>
<main id="app"></main>
<script>
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const clean=k=>k.flat(9).filter(c=>c!=null&&c!==false&&c!=='');
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v==null||v===false)continue;if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(x==='class')e.className=v;else e.setAttribute(x,v===true?'':v)}e.append(...clean(k));return e};
const put=(el,...k)=>el.replaceChildren(...clean(k));
const mem={};
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return mem[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=v}},del:k=>{try{localStorage.removeItem(k)}catch{delete mem[k]}}};
const ok=u=>/^https?:\/\//i.test(u||'');
const okImg=u=>ok(u)||/^data:image\//.test(u||'');
const num=p=>{const n=parseFloat(String(p||'').replace(/[^\d,.]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));return isNaN(n)?Infinity:n};
const eur=p=>{p=String(p||'').trim();return p&&!p.includes('€')?p+' €':p};
const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const OCC={Geburtstag:'🎂',Weihnachten:'🎄',Hochzeit:'💍',Sonstiges:'🎁'};
const icon=o=>OCC[o]||'🎁';
const QS=['Wie hieß dein erstes Haustier?','In welcher Stadt bist du geboren?','Was ist dein Lieblingsessen?','Wie hieß deine erste Schule?'];
const toast=m=>{const t=h('div',{class:'toast',role:'status'},m);document.body.append(t);setTimeout(()=>t.remove(),2600)};
const burst=e=>{if(!e||(!e.clientX&&!e.clientY))return;for(let i=0;i<16;i++){const p=h('span',{class:'p',style:`left:${e.clientX}px;top:${e.clientY}px;--dx:${(Math.random()-.5)*320}px;--dy:${-Math.random()*260-40}px`},['🎉','✨','🎁','💖'][i%4]);document.body.append(p);setTimeout(()=>p.remove(),1000)}};
const rain=()=>{for(let i=0;i<60;i++){const e=h('span',{class:'rain',style:`left:${Math.random()*100}%;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*3}s`},['🎉','🎊','🎈','✨','🎁','💖'][i%6]);document.body.append(e);setTimeout(()=>e.remove(),10000)}};

/* ---------- Hell / Dunkel ---------- */
const root=document.documentElement;
{const t=ls.get('wl-theme');if(t)root.dataset.theme=t}
const darkNow=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const setTheme=t=>{root.dataset.theme=t;ls.set('wl-theme',t);nav()};

/* ---------- Backend: Netlify-Function (/api). Ohne Backend (Vorschau) -> Demo-Modus im Browser ---------- */
const L={
 db(){const db=JSON.parse(ls.get('wl-db')||'{"u":{},"w":{}}');for(const u of Object.values(db.u))if(!u.lists)u.lists=u.slug?[u.slug]:[];for(const w of Object.values(db.w)){w.occasion=w.occasion||'Geburtstag';w.items=(w.items||[]).map(i=>({pri:0,res:false,...i}))}return db},
 run(a,d){
  const db=L.db(),sv=()=>ls.set('wl-db',JSON.stringify(db)),cp=o=>JSON.parse(JSON.stringify(o)),em=String(d.email||'').trim().toLowerCase();
  const mk=()=>Array.from({length:10},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.random()*36|0]).join('');
  if(a==='register'){if(!d.name||!d.bd||!/^.+@.+\..+$/.test(em)||(d.pw||'').length<6||!d.q||!String(d.qa||'').trim())return{error:'Bitte alle Felder ausfüllen (Passwort min. 6 Zeichen)'};if(db.u[em])return{error:'E-Mail ist schon registriert'};const s=mk();db.u[em]={pw:d.pw,q:d.q,qa:String(d.qa).trim().toLowerCase(),lists:[s]};db.w[s]={slug:s,name:d.name,bd:d.bd,occasion:d.occasion||'Geburtstag',items:[]};sv();return{token:em,slug:s}}
  if(a==='login'){const u=db.u[em];if(!u||u.pw!==d.pw)return{error:'E-Mail oder Passwort falsch'};return{token:em,slug:u.lists[0]}}
  if(a==='resetq'){const u=db.u[em];return u?{q:u.q||'Sicherheitsfrage'}:{error:'E-Mail nicht gefunden'}}
  if(a==='reset'){const u=db.u[em];if(!u)return{error:'E-Mail nicht gefunden'};if((u.qa||'')!==String(d.qa||'').trim().toLowerCase())return{error:'Antwort ist falsch'};if((d.pw||'').length<6)return{error:'Neues Passwort: min. 6 Zeichen'};u.pw=d.pw;sv();return{token:em,slug:u.lists[0]}}
  if(a==='get'){const w=db.w[d.slug];return w?cp(w):{error:'Liste nicht gefunden'}}
  if(a==='reserve'){const it=db.w[d.slug]?.items.find(i=>i.id===Number(d.id));if(!it)return{error:'Wunsch nicht gefunden'};it.res=!!d.on;sv();return{ok:true}}
  const u=db.u[d.token];if(!u)return{error:'Nicht angemeldet'};
  if(a==='me')return{lists:u.lists.filter(s=>db.w[s]).map(s=>({slug:s,name:db.w[s].name,bd:db.w[s].bd,occasion:db.w[s].occasion,count:db.w[s].items.length}))};
  if(a==='newlist'){if(!d.name||!d.bd)return{error:'Bitte Name und Datum angeben'};if(u.lists.length>=10)return{error:'Maximal 10 Listen'};const s=mk();db.w[s]={slug:s,name:d.name,bd:d.bd,occasion:d.occasion||'Geburtstag',items:[]};u.lists.push(s);sv();return{slug:s}}
  const w=db.w[d.slug];if(!w||!u.lists.includes(d.slug))return{error:'Keine Berechtigung'};
  if(a==='getown'){const c=cp(w);c.items.forEach(i=>delete i.res);return c}
  if(a==='save'){const r=new Map(w.items.map(i=>[i.id,i.res]));w.items=d.items.map(i=>({...i,res:!!r.get(i.id)}));sv();return{ok:true}}
  if(a==='meta'){if(d.name)w.name=d.name;if(d.bd)w.bd=d.bd;if(d.occasion)w.occasion=d.occasion;sv();return{ok:true}}
  if(a==='dellist'){if(u.lists.length<=1)return{error:'Die letzte Liste kann nicht gelöscht werden'};delete db.w[d.slug];u.lists=u.lists.filter(x=>x!==d.slug);sv();return{ok:true,slug:u.lists[0]}}
  return{error:'Unbekannte Aktion'}}};
let remote=null;
const R=(a,d)=>fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:a,...d})}).then(r=>r.json());
const detect=async()=>{if(remote===null){try{remote=(await R('ping',{})).ok===true}catch{remote=false}}};
async function api(a,d={}){await detect();try{return remote?await R(a,d):L.run(a,d)}catch{return{error:'Verbindung fehlgeschlagen – bitte nochmal versuchen'}}}

/* ---------- Zustand & Routing ---------- */
let tok=ls.get('wl-tok')||'',cur=ls.get('wl-cur')||ls.get('wl-slug')||'',rid=0,timer=0,pubView=false;
const setCur=s=>{cur=s;ls.set('wl-cur',s)};
const logout=()=>{tok=cur='';['wl-tok','wl-cur','wl-slug','wl-mine'].forEach(ls.del)};
const routeOf=()=>{const s=(location.hash.slice(2)||location.pathname.slice(1)).toLowerCase();return s==='edit'||/^[a-z0-9]{6,12}$/.test(s)?s:''};
const go=s=>{if(remote){history.pushState(0,'',s?'/'+s:'/');render()}else{const nh=s?'#/'+s:'';if(location.hash===nh||(!nh&&!location.hash))render();else location.hash=nh}};
const urlOf=slug=>remote?location.origin+'/'+slug:location.href.split('#')[0]+'#/'+slug;
const myLists=()=>{try{return JSON.parse(ls.get('wl-mine')||'[]')}catch{return[]}};

/* ---------- Bausteine ---------- */
function nav(){const dark=darkNow();put($('#nav'),
 !pubView&&tok&&h('button',{class:'g acc',onclick:()=>go('edit')},'Meine Listen'),
 !pubView&&tok&&h('button',{class:'g acc',onclick:()=>{logout();go('')}},'Abmelden'),
 h('button',{class:'g icon',title:dark?'Helles Design':'Dunkles Design','aria-label':'Design umschalten',onclick:()=>setTheme(dark?'light':'dark')},dark?'☀️':'🌙'))}

 const url=urlOf(w.slug),save=async()=>{const r=await api('save',{token:tok,slug:w.slug,items:w.items});if(r.error)toast('⚠️ '+r.error)};

  lists.length>1&&h('button',{class:'g',onclick:async e=>{const b=e.currentTarget;if(!delArm){delArm=true;b.textContent='Wirklich löschen?';setTimeout(()=>{delArm=false;b.textContent='🗑 Löschen'},3000);return}const r=await api('dellist',{token:tok,slug:w.slug});if(r.error)return toast(r.error);setCur(r.slug);toast('Liste gelöscht');render()}},'🗑 Löschen')),panel));

 const T=h('input',{placeholder:'Produkt *','aria-label':'Produkt'}),Lk=h('input',{placeholder:'Link zum Shop','aria-label':'Link zum Shop',inputmode:'url'}),P=h('input',{placeholder:'Preis (z.B. 49,99)','aria-label':'Preis',inputmode:'decimal'}),I=h('input',{placeholder:'Bild-URL (optional)','aria-label':'Bild-URL',inputmode:'url'}),F=h('input',{type:'file',accept:'image/*','aria-label':'Bild hochladen'});

   w.items.push({id:Date.now(),title:t,link:l,price:eur(P.value),img,pri});await save();
   [T,Lk,P,I,F].forEach(x=>x.value='');pri=0;const n=starPick(0,v=>pri=v);sp.replaceWith(n);sp=n;draw();toast('Wunsch hinzugefügt 🎁')}},'Hinzufügen'))));

 // Teilen & Export
 const qr=h('div',{class:'qr'});
 app.append(h('div',{class:'box noprint'},h('h3',{},'Teilen'),

/* ---------- Öffentliche Ansicht (Link für Freunde) ---------- */
function pub(app,w){
 const preview=myLists().includes(w.slug); // Besitzer schaut sich seine eigene Liste an -> Reservierungen verstecken
 if(preview)w.items.forEach(i=>i.res=false);
 app.append(head(w));
 if(preview)app.append(h('div',{class:'preview c noprint'},'👀 So sehen deine Freunde die Liste. Reservierungen bleiben für dich geheim. ',h('a',{href:'#',style:'color:var(--ac);font-weight:700',onclick:e=>{e.preventDefault();go('edit')}},'Zurück zum Bearbeiten')));
 const stats=h('div',{class:'stats'}),g=h('div',{class:'grid'});
 const draw=()=>{
  const list=[...w.items].sort((a,b)=>(b.pri||0)-(a.pri||0)||((num(a.price)-num(b.price))||0));
  const r=w.items.filter(i=>i.res).length;
  put(stats,h('span',{class:'chip'},`🎁 ${w.items.length} ${w.items.length===1?'Wunsch':'Wünsche'}`),!preview&&w.items.length&&h('span',{class:'chip'},`✅ ${r} von ${w.items.length} reserviert`));
  if(!list.length)return put(g,h('p',{class:'mu c empty'},'Noch keine Wünsche – bald gibt es hier was zu sehen ✨'));
  put(g,list.map((it,i)=>card(it,i,{pub:!preview,slug:w.slug,onRes:async e=>{
   const key=`wl-r:${w.slug}:${it.id}`,mine=ls.get(key)==='1';if(it.res&&!mine)return;const on=!it.res;
   const r=await api('reserve',{slug:w.slug,id:it.id,on});if(r.error)return toast(r.error);
   it.res=on;on?ls.set(key,'1'):ls.del(key);if(on){burst(e);toast('Reserviert – danke! 🎉')}draw()}})))};
 tilt(g);
 app.append(stats,!preview&&h('p',{class:'mu c hint noprint'},`Tipp: Klicke „Ich besorge das“, damit nichts doppelt geschenkt wird. ${w.name} sieht das nicht 🤫`),g,
  h('p',{class:'c foot noprint',style:'margin-top:30px'},h('a',{href:'#',onclick:e=>{e.preventDefault();go(tok?'edit':'')}},tok?'Zu meinen Listen →':'Eigene Wunschliste erstellen →')));
 draw()}

const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>{URL.revokeObjectURL(u);r('')};i.src=u});

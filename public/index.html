<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf9f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="description" content="Erstelle deine Wunschliste und teile sie mit Freunden.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Wunschliste – Wünsche sammeln &amp; teilen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fbf9f1;--sf:#ffffff;--sf2:#f3f0e5;--tx:#1b1a17;--mu:#6b675d;--bd:#e5e0d0;--bd2:#d6d0bd;--ac:#ead9ff;--acb:#1b1a17;--act:#1b1a17;--gr:#0e4b3b;--gold:#c8961e;--sh:0 1px 2px rgba(27,26,23,.04),0 8px 24px rgba(27,26,23,.06);--serif:"EB Garamond",Georgia,"Times New Roman",serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--sf:#1b1a18;--sf2:#24221f;--tx:#f2eee3;--mu:#a39e90;--bd:#302e29;--bd2:#45423b;--ac:#d9c4ff;--acb:#d9c4ff;--act:#16141a;--gr:#1d6a54;--gold:#e0b44a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--sf:#1b1a18;--sf2:#24221f;--tx:#f2eee3;--mu:#a39e90;--bd:#302e29;--bd2:#45423b;--ac:#d9c4ff;--acb:#d9c4ff;--act:#16141a;--gr:#1d6a54;--gold:#e0b44a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--sans);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Kopfzeile wie eine schwebende Leiste */
header{position:sticky;top:0;z-index:15;padding:14px 16px 0}
.hd{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 7px 7px 16px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
#nav{display:flex;gap:6px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.logo svg.i{width:22px;height:22px;stroke-width:2}
/* Knöpfe */
button,.btn{font:inherit;font-weight:600;font-size:15px;border:1.5px solid var(--acb);border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;background:var(--ac);color:var(--act);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 -1px var(--acb)}
button:active,.btn:active{transform:translateY(0);box-shadow:none}
button:focus-visible,.btn:focus-visible,a:focus-visible,.logo:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
button.g,.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd2)}
button.g:hover,.btn.g:hover{background:var(--sf2);box-shadow:none;border-color:var(--bd2)}
button.icon{padding:8px;width:40px;min-height:40px}
main{max-width:1000px;margin:0 auto;padding:10px 20px 70px;position:relative}
.c{text-align:center}.mu{color:var(--mu)}
/* Typografie */
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:56px 0 14px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7.2vw,78px);line-height:1;letter-spacing:-.025em;margin:0 0 18px;overflow-wrap:anywhere;animation:in .7s both}
h1 em{font-style:italic;font-weight:400}
h2{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.01em;margin:0 0 14px;line-height:1.1}
h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.lead{font-size:18px;max-width:440px;margin:0 auto 6px;line-height:1.45}
/* Flächen */
.box{max-width:760px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:24px;margin:16px auto;box-shadow:var(--sh);animation:in .5s both}
.box>h3+p.mu{margin-top:0}
.auth{max-width:420px;margin-top:28px}
.auth h2{text-align:center}
.auth label{display:block;margin-top:6px;font-size:14px;font-weight:600;color:var(--tx)}
.wide{width:100%;margin-top:10px;padding:13px;font-size:16px}
.links{text-align:center;line-height:2.1;font-size:14.5px;margin-bottom:0}
.links a,.foot a{color:var(--tx);font-weight:600;text-decoration:underline;text-decoration-color:var(--bd2);text-underline-offset:3px}
.links a:hover,.foot a:hover{text-decoration-color:var(--tx)}
input,select{font:inherit;font-size:16px;width:100%;min-height:46px;padding:11px 14px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg);color:var(--tx);margin:5px 0;outline:0;transition:box-shadow .15s,border-color .15s}
input::placeholder{color:var(--mu);opacity:.8}
select option{background:var(--sf);color:var(--tx)}
input[type=file]{min-height:auto;padding:8px}
input[type=file]::file-selector-button{font:inherit;font-weight:600;border:1px solid var(--bd2);border-radius:8px;padding:7px 14px;margin-right:12px;cursor:pointer;color:var(--tx);background:var(--sf2)}
input:focus,select:focus{border-color:var(--tx);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 70%,transparent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.lf{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
/* Countdown */
.cd{display:flex;gap:10px;justify-content:center;margin:22px 0 6px;animation:in .8s both}
.cd div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 6px 8px;min-width:78px;box-shadow:var(--sh)}
.cd b{display:block;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.party{display:inline-flex;align-items:center;gap:8px;background:var(--gr);color:#fff;font-weight:600;font-size:18px;padding:10px 22px;border-radius:99px}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.chip.dk{background:var(--gr);border-color:var(--gr);color:#fff}
.hint{max-width:560px;margin:8px auto}
/* Sterne */
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.st,.cst{background:none;box-shadow:none!important;border:0;padding:2px 4px;min-height:auto;width:auto;color:var(--bd2);font-size:28px;line-height:1;transform:none!important}
.cst{font-size:20px}
.st.on,.cst.on{color:var(--gold)}
.st:hover,.cst:hover{color:var(--gold)}
.pri{color:var(--gold);letter-spacing:2px;font-size:15px}
/* Karten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:22px}
.empty{grid-column:1/-1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;animation:in .5s backwards;transition:transform .2s,box-shadow .2s,opacity .2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.card[draggable=true]{cursor:grab}
.card.drag{opacity:.4}
.card.over{outline:2px dashed var(--tx);outline-offset:3px}
.card.res .im{filter:grayscale(1);opacity:.55}
.im{aspect-ratio:4/3;background:var(--sf2) center/cover;display:grid;place-items:center;color:var(--bd2);border-bottom:1px solid var(--bd)}
.im svg.i{width:48px;height:48px;stroke-width:1.2}
.rib{position:absolute;top:10px;right:10px;z-index:2;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;padding:6px 14px;border-radius:99px;font-weight:600;font-size:13.5px;color:#fff;background:var(--gr);box-shadow:0 6px 16px rgba(0,0,0,.18);animation:in .4s both}
.b{padding:16px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;flex:1}
.b strong{font-size:16.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.price{font-family:var(--serif);font-size:22px;line-height:1.2}
.b .btn,.b .rbtn{margin-top:auto;width:100%}
.b>.btn{margin-top:auto}
.b .btn+.rslot{margin-top:6px}
.rslot{width:100%;margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.rslot input{margin:0;min-height:42px;padding:8px 12px}
.rnote{font-size:12px;line-height:1.35}
.mv{display:flex;gap:6px;width:100%;padding-top:10px}
.mv button{flex:1;min-height:36px;padding:4px}
.n{position:absolute;top:10px;left:10px;z-index:2;font-weight:600;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);color:var(--mu)}
.x{position:absolute;top:8px;right:8px;width:32px;min-height:32px;padding:0;border-radius:99px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);z-index:2}
.x.ed{right:46px}.x.ed:hover{background:var(--sf2);border-color:var(--bd2);color:var(--tx)}
.x:not(.ed):hover{background:#fbe9e7;border-color:#e3a59b;color:#a8321f;box-shadow:none}
.x svg.i{width:15px;height:15px}
.qr{display:flex;justify-content:center;margin-top:10px}
.qr:not(:empty){padding:14px;background:#fff;border:1px solid var(--bd);border-radius:14px;width:max-content;margin:12px auto 0}
.qr img,.qr canvas{display:block}
.preview{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;max-width:620px;margin:16px auto;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:var(--tx);color:var(--bg);font-weight:500;padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:in .25s both;max-width:calc(100% - 32px)}
.shake{animation:shake .4s both!important}
.rain{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.small{font-size:14px}
.full{width:100%;margin-top:12px;padding:13px;font-size:16px}
/* Bereiche (Tabs) wie ein Umschalter */
.tabs{display:flex;gap:4px;margin:28px auto 8px;max-width:560px;padding:4px;background:var(--sf2);border:1px solid var(--bd);border-radius:99px}
.tab{flex:1;gap:7px;background:none;color:var(--mu);border:1px solid transparent;border-radius:99px;padding:8px 10px;min-height:42px;font-weight:600;font-size:14.5px}
.tab:hover{transform:none;box-shadow:none;color:var(--tx)}
.tab.on,.tab.on:hover{background:var(--sf);color:var(--tx);border-color:var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ti{display:inline-flex}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--tx);color:var(--bg);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.tab:not(.on) .badge{background:var(--bd2);color:var(--tx)}
.tabbody{animation:in .3s both}
.seg{display:flex;gap:4px;max-width:400px;margin:14px auto 0;padding:4px;background:var(--sf2);border:1px solid var(--bd);border-radius:99px}
.seg button{flex:1;background:none;color:var(--mu);border:1px solid transparent;min-height:36px;padding:6px 10px;font-size:14px;border-radius:99px}
.seg button:hover{transform:none;box-shadow:none;color:var(--tx)}
.seg button.on{background:var(--sf);color:var(--tx);border-color:var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fld{display:block;margin:8px 0}
.fl{display:block;font-weight:600;font-size:14px;margin:4px 0 0}
.fld small{display:block;font-size:12.5px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px}
.imgrow{display:flex;gap:16px;align-items:center;margin:8px 0}
.imgrow .fld{flex:1}
.prev{width:92px;height:92px;flex:none;border-radius:12px;background:var(--sf2) center/cover;border:1px dashed var(--bd2);display:grid;place-items:center;color:var(--mu)}
.prev svg.i{width:30px;height:30px;stroke-width:1.4}
.shares{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0 4px}
.sh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 8px;min-height:88px;border:1px solid var(--bd);border-radius:14px;font-weight:600;font-size:14.5px;color:var(--tx);background:var(--bg);text-decoration:none;box-shadow:none;transition:transform .15s,border-color .15s,background .15s}
.sh:hover{transform:translateY(-2px);border-color:var(--bd2);background:var(--sf2);box-shadow:none}
.si{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;color:#fff}
.si svg.i{width:18px;height:18px}
.wa .si{background:#1f8a5b}.tg .si{background:#2a7fc0}.sms .si{background:#b5651d}.mail .si{background:#5b4bb7}.more .si{background:var(--tx);color:var(--bg)}
.copy{display:flex;gap:8px;align-items:center}
.copy input{flex:1;margin:0;min-width:0}
.qrwrap .tools{margin-top:14px}
.lcards{display:grid;gap:8px;margin-top:12px}
.lcard{width:100%;justify-content:flex-start;gap:14px;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:12px 14px;font-weight:500}
.lcard:hover{box-shadow:none;background:var(--sf2)}
.lcard.on{border-color:var(--tx)}
.li{font-size:24px;line-height:1;width:42px;height:42px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;flex:none}
.lt2{flex:1;display:flex;flex-direction:column;min-width:0}
.lt2 small{font-weight:400}
.chip.sm{padding:3px 10px;font-size:12.5px}
.steps{text-align:left;max-width:440px;margin:10px auto 18px;line-height:1.9;padding-left:24px}
.big{width:64px;height:64px;margin:0 auto 12px;border-radius:99px;background:var(--ac);color:var(--act);display:grid;place-items:center}
.big svg.i{width:28px;height:28px}
.how{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px auto 0}
.how span{background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:5px 14px 5px 5px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.how b{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:var(--act);background:var(--ac);font-size:12.5px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:860px;margin:44px auto 0}
.feat{background:transparent;border:1px solid var(--bd);border-radius:16px;padding:20px}
.feat .fi{width:38px;height:38px;border-radius:10px;background:var(--ac);color:var(--act);display:grid;place-items:center;margin-bottom:12px}
.feat h3{margin-bottom:4px}
.feat p{margin:0;font-size:14.5px}
.foot{font-size:14.5px}
@media (max-width:760px){
 .tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;margin:0;max-width:none;border-radius:18px;padding:5px;background:var(--sf);box-shadow:0 10px 30px rgba(0,0,0,.14)}
 .tab{flex-direction:column;gap:3px;font-size:11.5px;padding:6px 2px;min-height:54px;position:relative;border-radius:13px}
 .tab.on,.tab.on:hover{background:var(--ac);color:var(--act);border-color:transparent;box-shadow:none}
 .tab svg.i{width:21px;height:21px}
 .tab .badge{position:absolute;top:4px;right:calc(50% - 24px);height:17px;min-width:17px;font-size:10.5px}
 body.hastabs main{padding-bottom:110px}
 body.hastabs .toast{bottom:calc(94px + env(safe-area-inset-bottom,0px))}
 .form3{grid-template-columns:1fr}
 .feats{grid-template-columns:1fr}
}
@media (max-width:560px){
 .form2{grid-template-columns:1fr}
 .shares{grid-template-columns:repeat(2,1fr)}
 .seg button{font-size:13px;padding:6px}
 .how span{font-size:13px}
}
@media (hover:none){button:hover,.btn:hover,.card:hover,.sh:hover{transform:none;box-shadow:none}}
@media (max-width:560px){
 header{padding:10px 10px 0}
 .hd{padding:6px 6px 6px 12px}
 .logo{font-size:17px}
 #nav button{padding:7px 12px;font-size:14px;min-height:38px}
 #nav button.icon{width:38px;padding:0}
 main{padding:6px 14px 40px}
 .eyebrow{margin-top:34px}
 .box{padding:20px 16px;border-radius:16px;margin:14px auto}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .rib{top:8px;right:8px;font-size:11.5px;padding:4px 10px;max-width:calc(100% - 56px)}
 .b{padding:11px;gap:3px}
 .b strong{font-size:14.5px}
 .price{font-size:18px}
 .b .btn,.b .rbtn{padding:8px 6px;font-size:13.5px;min-height:40px}
 .cd{gap:6px}.cd div{min-width:0;flex:1;max-width:80px}.cd b{font-size:28px}.cd span{font-size:10px}
 .cst{font-size:18px;padding:2px}
 .imgrow{align-items:flex-start}
}
#nav button{white-space:nowrap}
@media (max-width:360px){.grid{grid-template-columns:1fr}#nav .acc{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Drucken / PDF */
@media print{
 header,.p,.rain,.x,.mv,.noprint,.toast,button{display:none!important}
 body{background:#fff;color:#000}
 .card{break-inside:avoid;background:#fff;border:1px solid #ccc;box-shadow:none;animation:none}
 .grid{grid-template-columns:repeat(3,1fr)}
 .btn{display:block;color:#000;background:none;border:0;box-shadow:none;font-weight:400;font-size:0;overflow-wrap:anywhere}
 .btn::before{content:attr(href);font-size:10px}
 .cd div,.chip{background:#fff;border-color:#ccc;box-shadow:none}
}
</style></head>
<body>
<header><div class="hd"><div class="logo" id="logo" role="link" tabindex="0" aria-label="Wunschliste – Startseite"><span id="lg"></span><span class="lt">Wunschliste</span></div><div id="nav"></div></div></header>
<main id="app"></main>
<script>
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const clean=k=>k.flat(9).filter(c=>c!=null&&c!==false&&c!=='');
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v==null||v===false)continue;if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(x==='class')e.className=v;else e.setAttribute(x,v===true?'':v)}e.append(...clean(k));return e};
const put=(el,...k)=>el.replaceChildren(...clean(k));

const L={

  const db=L.db(),sv=()=>ls.set('wl-db',JSON.stringify(db)),cp=o=>JSON.parse(JSON.stringify(o)),em=String(d.email||'').trim().toLowerCase();
  const mk=()=>Array.from({length:10},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.random()*36|0]).join('');
  if(a==='register'){if(!d.name||!d.bd||!/^.+@.+\..+$/.test(em)||(d.pw||'').length<6||!d.q||!String(d.qa||'').trim())return{error:'Bitte alle Felder ausfüllen (Passwort min. 6 Zeichen)'};if(db.u[em])return{error:'E-Mail ist schon registriert'};const s=mk();db.u[em]={pw:d.pw,q:d.q,qa:String(d.qa).trim().toLowerCase(),lists:[s]};db.w[s]={slug:s,name:d.name,bd:d.bd,occasion:d.occasion||'Geburtstag',items:[]};sv();return{token:em,slug:s}}
  if(a==='login'||a==='reset'){const fk='wl-fail:'+em,now=Date.now();let f=null;try{f=JSON.parse(ls.get(fk)||'null')}catch{}
   if(f?.until>now){const m=Math.max(1,Math.ceil((f.until-now)/60000));return{error:`Zu viele Fehlversuche. Bitte in ${m} Minute${m>1?'n':''} nochmal versuchen.`,locked:m}}
   const u=db.u[em];if(a==='reset'&&!u)return{error:'E-Mail nicht gefunden'};
   const good=a==='login'?(u&&u.pw===d.pw):((u.qa||'')===String(d.qa||'').trim().toLowerCase());
   if(!good){if(!f||now-f.first>9e5||(f.until&&f.until<=now))f={n:0,first:now,until:0};f.n++;if(f.n>=5)f.until=now+9e5;ls.set(fk,JSON.stringify(f));const left=5-f.n;

    return{error:(a==='login'?'E-Mail oder Passwort falsch':'Antwort ist falsch')+(left<=3?` (noch ${left} Versuch${left>1?'e':''})`:'')}}
   ls.del(fk);if(a==='login')return{token:em,slug:u.lists[0]};
   if((d.pw||'').length<6)return{error:'Neues Passwort: min. 6 Zeichen'};u.pw=d.pw;sv();return{token:em,slug:u.lists[0]}}
  if(a==='resetq'){const u=db.u[em];return u?{q:u.q||'Sicherheitsfrage'}:{error:'E-Mail nicht gefunden'}}
  if(a==='get'){const w=db.w[d.slug];return w?cp(w):{error:'Liste nicht gefunden'}}

  if(a==='newlist'){if(!d.name||!d.bd)return{error:'Bitte Name und Datum angeben'};if(u.lists.length>=10)return{error:'Maximal 10 Listen'};const s=mk();db.w[s]={slug:s,name:d.name,bd:d.bd,occasion:d.occasion||'Geburtstag',items:[]};u.lists.push(s);sv();return{slug:s}}

function pub(app,w){
 const preview=myLists().includes(w.slug); // Besitzer schaut sich seine eigene Liste an -> Reservierungen verstecken

 const url=urlOf(w.slug);

  const list=[...w.items].sort((a,b)=>(b.pri||0)-(a.pri||0)||((num(a.price)-num(b.price))||0));
  const r=w.items.filter(i=>i.res).length;
  put(stats,h('span',{class:'chip'},`${w.items.length} ${w.items.length===1?'Wunsch':'Wünsche'}`),!preview&&w.items.length&&h('span',{class:'chip'},`${r} von ${w.items.length} reserviert`));
  if(!list.length)return put(g,h('p',{class:'mu c empty'},'Noch keine Wünsche – bald gibt es hier was zu sehen ✨'));
  put(g,list.map((it,i)=>card(it,i,{pub:!preview,slug:w.slug,owner:w.name,onRes:async(e,by)=>{
   const key=`wl-r:${w.slug}:${it.id}`,mine=ls.get(key)==='1';if(it.res&&!mine)return;const on=!it.res;
   const r=await api('reserve',{slug:w.slug,id:it.id,on,by:on?by:''});if(r.error)return toast(r.error);
   it.res=on;if(on&&by)it.by=by;else delete it.by;on?ls.set(key,'1'):ls.del(key);if(on){burst(e);toast(by?`Danke, ${by}! Reserviert 🎉`:'Reserviert – danke! 🎉')}draw()}})))};
 tilt(g);
 app.append(stats,
  !preview&&w.items.length&&h('div',{class:'how noprint'},h('span',{},h('b',{},'1'),' Geschenk aussuchen'),h('span',{},h('b',{},'2'),' „Ich besorge das“ tippen'),h('span',{},h('b',{},'3'),' Im Shop kaufen')),
  !preview&&w.items.length&&h('p',{class:'mu c small noprint'},`${w.name} sieht nicht, wer was reserviert hat.`),
  g,
  h('div',{class:'box noprint',style:'margin-top:30px'},h('h3',{},'Liste weiterleiten'),h('p',{class:'mu small'},'Schick die Liste an andere Gäste oder die Familie.'),

  h('p',{class:'c foot noprint',style:'margin-top:24px'},h('a',{href:'#',onclick:e=>{e.preventDefault();go(tok?'edit':'')}},tok?'Zu meinen Listen →':'Eigene Wunschliste erstellen →')));
 draw()}
